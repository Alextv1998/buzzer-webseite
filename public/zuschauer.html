<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Showlex – Zuschaueransicht</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:system-ui,Arial,sans-serif}body{display:grid;place-items:center;padding:3vmin}.panel{width:100%;height:100%;min-height:160px;border-radius:32px;background:rgba(10,15,27,.93);border:3px solid var(--accent,#ef4444);box-shadow:0 0 45px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 0 45px rgba(255,255,255,.025);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4%;gap:3%;transition:border-color .2s,box-shadow .2s}.indicator{height:14px;width:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent)}.eyebrow{font-size:clamp(15px,2.7vw,30px);font-weight:800;letter-spacing:.18em;color:#cbd5e1}.main{font-size:clamp(34px,8vw,115px);font-weight:1000;line-height:1.05;overflow-wrap:anywhere;color:var(--accent);text-shadow:0 0 28px color-mix(in srgb,var(--accent) 45%,transparent)}.subtitle{font-size:clamp(16px,2.5vw,30px);color:#f1f5f9;font-weight:650}.dotline{display:flex;gap:12px;align-items:center}.offline{--accent:#64748b}
</style></head><body><section class="panel offline" id="panel" aria-live="polite"><div class="dotline"><span class="indicator"></span><span class="eyebrow" id="heading">SHOWLEX BUZZER</span></div><div class="main" id="main">VERBINDE …</div><div class="subtitle" id="sub">Warte auf Serververbindung</div></section><script src="/socket.io/socket.io.js"></script><script>
const panel=document.getElementById('panel'),heading=document.getElementById('heading'),main=document.getElementById('main'),sub=document.getElementById('sub');const socket=io({reconnection:true});
function show(status,name,color){let accent='#ef4444',head='BUZZERSTATUS',title='BUZZER GESPERRT',description='Buzzern derzeit nicht möglich';if(status==='active'){accent='#22c55e';title='BUZZER AKTIV';description='Bereit zum Buzzern'}else if(status==='buzzed'){accent=/^#[0-9a-fA-F]{6}$/.test(color||'')?color:'#8b5cf6';head='BUZZER GEDRÜCKT';title=name||'TEAM';description='Hat gebuzzert!'}else if(status==='offline'){accent='#64748b';title='VERBINDUNG GETRENNT';description='Warte auf Serververbindung'}panel.style.setProperty('--accent',accent);heading.textContent=head;main.textContent=title;sub.textContent=description}
let latestState=null, spectatorSignalReceived=false, selectedIndex=0;
function displayFromState(s){
  if(!s)return;
  const buzzes=Array.isArray(s.buzzes)?s.buzzes:[];
  if(buzzes.length && selectedIndex<buzzes.length){
    const buzz=buzzes[selectedIndex];
    const teams=Array.isArray(s.teams)?s.teams:[];
    const team=teams.find(t=>t.id===buzz.teamId);
    show('buzzed',team?.name||buzz.name||'TEAM',team?.color||'#8b5cf6');
  }else show(s.roundOpen&&!s.globalBuzzerLocked?'active':'locked');
}
socket.on('state',s=>{
  const oldBuzzes=Array.isArray(latestState?.buzzes)?latestState.buzzes:[];
  const newBuzzes=Array.isArray(s?.buzzes)?s.buzzes:[];
  if(!newBuzzes.length || (s.roundStart!==latestState?.roundStart && latestState))selectedIndex=0;
  latestState=s;
  // Existing server versions already publish this authoritative state.
  // When spectator-state is available, it can additionally track "Weiter".
  if(!spectatorSignalReceived)displayFromState(s);
});
socket.on('spectator-state',s=>{
  spectatorSignalReceived=true;
  if(s.status==='buzzed'){
    const buzzes=Array.isArray(latestState?.buzzes)?latestState.buzzes:[];
    const teams=Array.isArray(latestState?.teams)?latestState.teams:[];
    const matching= buzzes.findIndex(b=>teams.some(t=>t.id===b.teamId && t.name===s.name));
    if(matching>=0)selectedIndex=matching;
  }else if(s.status==='active' && latestState?.buzzes?.length){
    selectedIndex=latestState.buzzes.length;
  }
  show(s.status,s.name,s.color);
});
socket.on('disconnect',()=>{spectatorSignalReceived=false;latestState=null;show('offline')});
socket.on('connect_error',()=>show('offline'));
</script></body></html>
